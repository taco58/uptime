apiVersion: apps/v1                                                                                                                              
kind: Deployment                                                                                                                                 
metadata:                                                                                                                                        
  name: api-deployment                                                                                                                           
spec:                                                                                                                                            
  replicas: 2                                                                                                                                    
  selector:                                                                                                                                      
    matchLabels:                                                                                                                                 
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: uptime-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgrespassword@postgres-service:5432/uptime?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis-service:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: uptime-secrets
                  key: JWT_SECRET

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080