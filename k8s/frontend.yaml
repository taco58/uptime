apiVersion: apps/v1                                                                                                                              
kind: Deployment                                                                                                                                 
metadata:                                                                                                                                        
  name: frontend-deployment                                                                                                                           
spec:                                                                                                                                            
  replicas: 2                                                                                                                                    
  selector:                                                                                                                                      
    matchLabels:                                                                                                                                 
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: uptime-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000